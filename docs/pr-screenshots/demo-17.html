<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>#17 UI color/focus fix</title>
<style>
:root{--error:#dc2626;--error-bg:#fef2f2;--warning:#ca8a04;--warning-bg:#fef9c3;--focus:#000;--success:#16a34a}
body{font-family:ui-monospace,monospace;padding:24px;max-width:720px;background:#fff}
h1{font-size:18px}
.card{border:1px solid #000;padding:16px;margin:16px 0}
.info-card.error{background:var(--error-bg);color:var(--error);border-color:var(--error)}
.info-badge{display:inline-block;border:1px solid currentColor;padding:2px 6px;font-size:11px;font-weight:700;letter-spacing:.05em}
.info-card.error .info-badge{color:var(--error);border-color:var(--error)}
.info-card.warning{background:var(--warning-bg);color:var(--warning);border-color:var(--warning)}
label{display:block;margin:12px 0 4px;font-size:12px}
input,button,[role=tab]{font-family:inherit;border:1px solid #000;background:#fff;padding:8px;outline:none}
input:focus-visible,button:focus-visible,[role=tab]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tabs{display:flex;gap:0;margin-top:12px}
[role=tab]{cursor:pointer}
[role=tab][aria-selected=true]{background:#000;color:#fff}
.ok{color:var(--success);font-size:13px}
</style></head><body>
<h1>Issue #17 — unified error colors + focus-visible</h1>
<div class="card info-card error">
  <div class="info-badge">ERROR</div>
  <p>Please fill in all required fields</p>
  <p class="ok">✓ Single semantic red (no orange/pink mix)</p>
</div>
<div class="card info-card warning">
  <div class="info-badge">WARNING</div>
  <p>Optional warning uses dedicated yellow token</p>
</div>
<label>FULL NAME</label>
<input id="name" placeholder="Focus me — outline only with keyboard focus-visible" style="width:100%">
<div class="tabs" role="tablist">
  <button type="button" role="tab" aria-selected="true" id="t1">TAB A</button>
  <button type="button" role="tab" aria-selected="false" id="t2">TAB B</button>
</div>
<p class="ok">✓ Mouse click no longer leaves a sticky focus ring; Tab key shows focus-visible outline</p>
<script>
const tabs=[...document.querySelectorAll('[role=tab]')];
tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.setAttribute('aria-selected',x===t?'true':'false')); t.blur()})
</script>
</body></html>
